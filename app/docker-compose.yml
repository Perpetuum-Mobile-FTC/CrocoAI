services:
  crocoai:
    build: .
    container_name: crocoai
    restart: unless-stopped
    # Resource caps (ops package E): a runaway process (AI agent child, ffmpeg) can't take the host down.
    mem_limit: 1.5g
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    env_file: .env
    environment:
      - TZ=Europe/Bucharest
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - wa
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

# The WhatsApp gateway's network (docs/instalare.md). WA_NETWORK comes from app/.env.
networks:
  wa:
    external: true
    name: ${WA_NETWORK:-moldflix_moldflix}
