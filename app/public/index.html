<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-title" content="CrocoAI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="/css/style.css">

<body>
<div id="app-shell" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">

        <svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

      </button>
    </header>
    <div id="view" class="view-container"></div>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
  <div id="more-sheet" class="sheet hidden"></div>
</div>

<div id="boot-loading" class="state state-loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;">
  <div class="spinner"></div>
  <p>Se încarcă…</p>
</div>

<script src="/js/pwa.js" defer></script>
<script type="module" src="/js/app.js"></script>
